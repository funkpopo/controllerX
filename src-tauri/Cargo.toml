[package]
name = "controllerx"
version = "0.1.0"
description = "Transparent desktop input overlay for controllers, keyboards, and mice."
authors = ["controllerX contributors"]
edition = "2021"
rust-version = "1.84"
license = "MIT"

[lib]
name = "controllerx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
anyhow = "1.0"
gilrs = "0.11.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_System_Registry", "Win32_UI_Input_XboxController", "Win32_UI_WindowsAndMessaging"] }
